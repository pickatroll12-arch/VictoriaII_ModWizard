[build-system]
# 64+: instalación editable (PEP 660) y globs recursivos "**" en package-data.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vic2studio"
dynamic = ["version"]
description = "Victoria II Mod Studio: editor visual de mods de Victoria II (motor Clausewitz)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 suelta referencias de más a None, True y False (en cada tarea de QThreadPool, entre otras).
    # Desde Python 3.12 esos objetos son inmortales; con 3.10 y 3.11 el proceso aborta. La 6.11.3 va bien.
    "PySide6>=6.5,<6.12; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
    "numpy>=1.24",
    "Pillow>=10",
]
keywords = ["victoria-ii", "paradox", "clausewitz", "modding", "editor"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]

[project.gui-scripts]
vic2studio = "vic2studio.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "vic2studio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["vic2studio*"]
# Solo carpetas con __init__.py: assets/ no es un paquete, viaja como package-data.
namespaces = false

[tool.setuptools.package-data]
vic2studio = [
    "i18n/*.json",
    "ui/*.qss",
    "assets/**/*",
]
