# Ejecutables de Victoria II Mod Studio para Linux y Windows (PyInstaller, one-folder; packaging/).
#
# Cada empuje a la rama de trabajo los construye, prueba cada ejecutable congelado (VIC2STUDIO_SMOKE_TEST: abre la
# ventana, comprueba sus textos en los dos idiomas y sale) y los deja como artefactos de la ejecución. Una etiqueta
# v* (por ejemplo v0.1.0-alpha.1) además publica los dos paquetes en una versión previa de GitHub, con las notas de
# packaging/release_notes_alpha.md. PyInstaller no compila en cruzado: cada sistema se construye en el suyo.
name: Ejecutables

on:
  push:
    branches: [claude/keen-fermi-nw8itc]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: el ejecutable funciona con glibc 2.35 o posterior.
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xkb1 libxcb-shape0 libxcb-util1

      - name: Dependencias
        run: python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Construir (Linux)
        if: runner.os == 'Linux'
        run: packaging/build_linux.sh --system

      - name: Construir (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PYTHON: python
        run: packaging\build_windows.bat --system

      - name: Prueba de humo (Linux)
        if: runner.os == 'Linux'
        env:
          VIC2STUDIO_SMOKE_TEST: "1"
        run: |
          export VIC2STUDIO_SETTINGS_DIR="$RUNNER_TEMP/settings" VIC2STUDIO_DATA_DIR="$RUNNER_TEMP/data" \
            VIC2STUDIO_CACHE_DIR="$RUNNER_TEMP/cache"
          timeout 180 "dist/Victoria II Mod Studio/Victoria II Mod Studio"

      - name: Prueba de humo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VIC2STUDIO_SMOKE_TEST = "1"
          $env:VIC2STUDIO_SETTINGS_DIR = "$env:RUNNER_TEMP\settings"
          $env:VIC2STUDIO_DATA_DIR = "$env:RUNNER_TEMP\data"
          $env:VIC2STUDIO_CACHE_DIR = "$env:RUNNER_TEMP\cache"
          # Ejecutable sin consola: el resultado llega por el código de salida (0: textos completos; 3: faltan).
          $p = Start-Process -FilePath "dist\Victoria II Mod Studio\Victoria II Mod Studio.exe" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "La prueba de humo no terminó en 3 minutos" }
          if ($p.ExitCode -ne 0) { throw "La prueba de humo falló (código $($p.ExitCode))" }
          "Prueba de humo: textos completos"

      - uses: actions/upload-artifact@v4
        with:
          name: vic2studio-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Versión previa
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l paquetes
          gh release create "$TAG" paquetes/* --prerelease --verify-tag \
            --title "Victoria II Mod Studio $TAG" --notes-file packaging/release_notes_alpha.md
