# Paquetes de Victoria II Mod Studio: instalador .exe para Windows (PyInstaller one-folder + Inno Setup) y AppImage
# para Linux (PyInstaller one-folder + appimagetool). PyInstaller no compila en cruzado: cada sistema se construye en
# el suyo.
#
# - Cada empuje a la rama de trabajo construye los dos paquetes y los prueba (sin artefactos: la cuota de
#   almacenamiento de Actions es pequeña y los paquetes van directos a la release cuando se publica).
#   Las pruebas: el ejecutable congelado, el instalador (instalar, abrir y desinstalar) y el AppImage, cada uno con
#   VIC2STUDIO_SMOKE_TEST (abre la ventana, comprueba sus textos y el trabajador del taller de mapas y sale con 0).
# - Lanzado a mano (workflow_dispatch) o con una etiqueta v*, además los publica en una versión previa de GitHub con
#   las notas de packaging/release_notes_alpha.md, y antes borra la release de la entrada «borrar» si existe.
#   La release se crea como borrador, cada sistema sube su paquete con su .sha256 y al final se hace pública.
name: Ejecutables

on:
  push:
    branches: [claude/project-thread-xjs4k1]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la versión que se publica
        required: true
        default: v0.1.0-alpha.10
      borrar:
        description: Release que se borra antes de publicar (vacío para no borrar ninguna)
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: Preparar la release (borrador)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OLD_RELEASE: ${{ inputs.borrar }}
    steps:
      - uses: actions/checkout@v4
      - name: Borrar la release anterior
        if: env.OLD_RELEASE != ''
        run: |
          if gh release view "$OLD_RELEASE" > /dev/null 2>&1; then
            gh release delete "$OLD_RELEASE" --cleanup-tag --yes
            echo "Borrada la release $OLD_RELEASE y su etiqueta"
          else
            echo "No hay ninguna release $OLD_RELEASE"
          fi
      - name: Crear el borrador
        run: |
          VERSION="$(PYTHONPATH=src python3 -c 'import vic2studio; print(vic2studio.__version__)')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Publicar otra vez la misma etiqueta a mano sustituye la release y la etiqueta.
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag --yes
            fi
            TARGET=(--target "$GITHUB_SHA")
          else
            TARGET=(--verify-tag)
          fi
          gh release create "$TAG" "${TARGET[@]}" --draft --prerelease \
            --title "Victoria II Mod Studio $VERSION (alfa, $TAG)" \
            --notes-file packaging/release_notes_alpha.md

  windows:
    name: Windows (instalador .exe)
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.20"
      - name: Versión
        id: version
        shell: bash
        run: echo "version=$(PYTHONPATH=src python -c 'import vic2studio; print(vic2studio.__version__)')" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        env:
          PYTHONPATH: src
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/vic2studio.spec
      - name: Prueba de humo del ejecutable
        shell: pwsh
        env:
          VIC2STUDIO_SMOKE_TEST: "1"
          QT_QPA_PLATFORM: offscreen
          VIC2STUDIO_SETTINGS_DIR: ${{ runner.temp }}/settings
          VIC2STUDIO_DATA_DIR: ${{ runner.temp }}/data
          VIC2STUDIO_CACHE_DIR: ${{ runner.temp }}/cache
        run: |
          function Invoke-Timed([string]$exe, [string[]]$arguments = @()) {
            $p = if ($arguments.Count) { Start-Process -FilePath $exe -ArgumentList $arguments -PassThru } else { Start-Process -FilePath $exe -PassThru }
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "Sin terminar en 5 min: $exe"; exit 1 }
            return $p.ExitCode
          }
          $code = Invoke-Timed "dist\Victoria II Mod Studio\Victoria II Mod Studio.exe"
          Write-Host "Código de salida: $code"
          if ($code -ne 0) { exit 1 }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\vic2studio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prueba del instalador (instalar, abrir y desinstalar)
        shell: pwsh
        env:
          VIC2STUDIO_SMOKE_TEST: "1"
          QT_QPA_PLATFORM: offscreen
          VIC2STUDIO_SETTINGS_DIR: ${{ runner.temp }}/settings
          VIC2STUDIO_DATA_DIR: ${{ runner.temp }}/data
          VIC2STUDIO_CACHE_DIR: ${{ runner.temp }}/cache
        run: |
          $setup = Get-ChildItem dist\VictoriaIIModStudio-*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "vic2studio-instalado"
          function Invoke-Timed([string]$exe, [string[]]$arguments = @()) {
            $p = if ($arguments.Count) { Start-Process -FilePath $exe -ArgumentList $arguments -PassThru } else { Start-Process -FilePath $exe -PassThru }
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "Sin terminar en 5 min: $exe"; exit 1 }
            return $p.ExitCode
          }
          $code = Invoke-Timed $setup.FullName @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"")
          if ($code -ne 0) { Write-Host "El instalador salió con $code"; exit 1 }
          $code = Invoke-Timed (Join-Path $dir "Victoria II Mod Studio.exe")
          Write-Host "Código de salida del instalado: $code"
          if ($code -ne 0) { exit 1 }
          $code = Invoke-Timed (Join-Path $dir "unins000.exe") @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          Write-Host "Desinstalador: $code"
      - name: Subir a la release
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          cd dist
          f=$(ls VictoriaIIModStudio-*-setup.exe)
          sha256sum "$f" > "$f.sha256"
          cat "$f.sha256"
          gh release upload "$TAG" "$f" "$f.sha256" --clobber

  linux:
    name: Linux (AppImage)
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: write
    # 22.04: el AppImage funciona en glibc 2.35 o posterior.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bibliotecas del sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xkb1 libxcb-shape0 libxcb-util1
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.20"
      - name: Pruebas de empaquetado y textos
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_packaging test_i18n test_arch_writes
      - name: PyInstaller
        env:
          PYTHONPATH: src
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/vic2studio.spec
      - name: Prueba de humo del ejecutable
        env:
          VIC2STUDIO_SMOKE_TEST: "1"
          QT_QPA_PLATFORM: offscreen
          VIC2STUDIO_SETTINGS_DIR: ${{ runner.temp }}/settings
          VIC2STUDIO_DATA_DIR: ${{ runner.temp }}/data
          VIC2STUDIO_CACHE_DIR: ${{ runner.temp }}/cache
        run: timeout 300 "dist/Victoria II Mod Studio/Victoria II Mod Studio"
      - name: AppImage
        run: packaging/linux/build_appimage.sh python
      - name: Prueba de humo del AppImage
        env:
          VIC2STUDIO_SMOKE_TEST: "1"
          QT_QPA_PLATFORM: offscreen
          VIC2STUDIO_SETTINGS_DIR: ${{ runner.temp }}/settings
          VIC2STUDIO_DATA_DIR: ${{ runner.temp }}/data
          VIC2STUDIO_CACHE_DIR: ${{ runner.temp }}/cache
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: timeout 300 dist/Victoria_II_Mod_Studio-*.AppImage
      - name: Subir a la release
        if: env.PUBLISH == 'true'
        run: |
          cd dist
          f=$(ls Victoria_II_Mod_Studio-*.AppImage)
          sha256sum "$f" > "$f.sha256"
          cat "$f.sha256"
          gh release upload "$TAG" "$f" "$f.sha256" --clobber

  publish:
    name: Hacer pública la release
    needs: [release, windows, linux]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG"
